# v1.0.0
name: Auto Visit Streamlit

on:
  schedule:
    # 每兩小時執行一次 (cron 語法)
    - cron: '0 */2 * * *'
  workflow_dispatch: # 允許您手動點擊執行測試

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run visit script
        run: python visit.py
